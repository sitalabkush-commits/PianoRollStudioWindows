name: Android CI
on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests (pure JVM core modules + others)
        run: ./gradlew test -x :app-desktop:test --stacktrace
      - name: Debug APK
        run: ./gradlew :app-android:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app-android/build/outputs/apk/debug/*.apk

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > $RUNNER_TEMP/release.jks
      - name: Release AAB (signing wiring added by Claude A once keystore exists)
        run: ./gradlew :app-android:bundleRelease --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: release-aab
          path: app-android/build/outputs/bundle/release/*.aab
